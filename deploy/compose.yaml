# Brinelight online: the database, the game server and Caddy (HTTPS), on one machine.
# Started from this folder: docker compose up -d --build. The settings come from deploy/.env (see .env.example).
# Images have exact versions: they change only when we decide to (docs/deploy.md, "Update the images").
name: brinelight

x-logs: &logs
  # Docker logs are capped (3 files of 10 MB per service), so they never fill the disk.
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: brinelight
      POSTGRES_DB: brinelight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql
    # No "ports": the database is never reachable from the Internet, only from the game server.
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brinelight", "-d", "brinelight"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logs

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: brinelight-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: postgres://brinelight:${POSTGRES_PASSWORD}@db:5432/brinelight
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in deploy/.env}
      SIWS_CHAIN_ID: ${SIWS_CHAIN_ID:-mainnet}
      # Only Caddy (its fixed address below) may say who the player is, with X-Forwarded-For.
      TRUSTED_PROXY: 172.30.0.10
      # Where /health reads the last backup's time and the last test restore's result (backup.sh, restore.sh).
      HEALTH_STATUS_DIR: /status
      # The notary on Solana (docs/proofs.md): its network, and one key per network, made by notary-key.sh. The server
      # reads only the key of SOLANA_CLUSTER and takes both out of its environment at start. Empty: no notary.
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-}
      NOTARY_KEY_DEVNET: ${NOTARY_KEY_DEVNET:-}
      NOTARY_KEY_MAINNET: ${NOTARY_KEY_MAINNET:-}
      SOLANA_RPC_URLS: ${SOLANA_RPC_URLS:-}
    volumes:
      # Read-only, and only the status folder: two one-line files, never a dump.
      - ${STATUS_DIR:-/var/lib/brinelight/status}:/status:ro
    depends_on:
      db: { condition: service_healthy }
    # No "ports" either: only Caddy reaches it.
    networks: [edge, data]
    <<: *logs

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    # The only open ports of the machine, with SSH: 80 (certificates) and 443 (HTTPS, also over UDP for HTTP/3).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]
    networks:
      edge: { ipv4_address: 172.30.0.10 }
    <<: *logs

networks:
  # Caddy and the server.
  edge:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  # The server and the database; "internal": no way out to the Internet from here.
  data:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
