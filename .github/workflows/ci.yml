name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    # Actions at the same moment on a real PostgreSQL: PGlite runs one transaction at a time and cannot show a locking bug.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: brinelight_test
          # A throwaway database for this job only, reachable from the runner alone: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brinelight_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run server/test/concurrency.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brinelight_test

  e2e:
    runs-on: ubuntu-latest
    # Not blocking yet (week 3): it becomes required once it has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/.shots/
          if-no-files-found: ignore

  deploy:
    # The online setup (deploy/): scripts checked, then the whole stack started as on the server, with a local certificate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      - name: Start the stack
        working-directory: deploy
        run: |
          {
            echo "API_DOMAIN=localhost"
            echo "ALLOWED_ORIGINS=https://play.example.test"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Check it
        working-directory: deploy
        run: |
          curl -fsSk https://localhost/health
          # The database and the game server are never reachable from outside.
          for port in 5432 8787; do
            if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "Port $port is open, it must not be"; exit 1; fi
          done
          # A backup, then a test restore of it.
          BACKUP_DIR="$RUNNER_TEMP/backups" sudo -E ./backup.sh
          BACKUP_DIR="$RUNNER_TEMP/backups" sudo -E ./restore.sh test
      - if: failure()
        working-directory: deploy
        run: docker compose logs --tail 100
