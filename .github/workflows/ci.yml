name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    # Actions at the same moment on a real PostgreSQL: PGlite runs one transaction at a time and cannot show a locking bug.
    # And the stored cities' migration on a real PostgreSQL: a database left by the week 4 server, opened by today's.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: brinelight_test
          # A throwaway database for this job only, reachable from the runner alone: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brinelight_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One file after the other: they empty the same database, and the migration test rebuilds it as week 4 left it.
      - run: npx vitest run --no-file-parallelism server/test/concurrency.test.ts server/test/migration.test.ts server/test/proofs.test.ts server/test/seal.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brinelight_test

  e2e:
    runs-on: ubuntu-24.04
    # Not blocking yet (week 3): it becomes required once it has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/.shots/
          if-no-files-found: ignore
          # e2e/.shots is a hidden folder: upload-artifact@v4 leaves those out unless asked.
          include-hidden-files: true

  deploy:
    # The online setup (deploy/): scripts checked, then the whole stack started as on the server, with a local certificate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: shellcheck deploy/*.sh
      - name: Start the stack
        working-directory: deploy
        run: |
          {
            echo "API_DOMAIN=localhost"
            echo "ALLOWED_ORIGINS=https://play.example.test"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
          } > .env
          # The notary's key files, empty (no key), as update.sh makes them on the server.
          (umask 077 && mkdir -p secrets && touch secrets/notary-devnet.key secrets/notary-mainnet.key)
          docker compose up -d --build --wait --wait-timeout 180
      - name: Check it
        working-directory: deploy
        run: |
          # /health's status code and answer, on one line.
          health() { code="$(curl -sSk -o "$RUNNER_TEMP/health.json" -w '%{http_code}' https://localhost/health)"; echo "$code $(cat "$RUNNER_TEMP/health.json")"; }
          expect() { out="$(health)"; echo "$out"; grep -Eq "$1" <<< "$out"; }
          # Before the first backup: the database answers, and /health says the backup is missing.
          expect '^503 .*"database":"ok".*"backup":"none"'
          # The database and the game server are never reachable from outside.
          for port in 5432 8787; do
            if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "Port $port is open, it must not be"; exit 1; fi
          done
          # The nightly backup and the weekly test restore, installed as on the server, each started once by hand.
          sudo ./install-backup.sh
          sudo systemctl start brinelight-backup.service
          expect '^200 .*"database":"ok","backup":"ok","restore":"none"'
          sudo systemctl start brinelight-restore-test.service
          expect '^200 .*"restore":"ok"'
          # The database stopped: 503, database down; started again: all well.
          docker compose stop db
          expect '^503 .*"database":"down"'
          docker compose start db
          for _ in $(seq 1 30); do if health | grep -q '^200 '; then break; fi; sleep 2; done
          expect '^200 .*"ok":true'
      - name: Load test (20 players for 30 seconds; the real one runs on the server, docs/perf.md)
        working-directory: deploy
        run: |
          # Caddy's local certificate, trusted for this run only.
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/caddy-root.crt" npm run load -- --url https://localhost --origin https://play.example.test --stages 20 --stage-seconds 30 --stats
      - name: The notary's key, a Docker Compose secret, never in the container's environment
        working-directory: deploy
        run: |
          # A throwaway devnet key, never funded, made by the server's own keygen; owned by the server's user (1000).
          out="$(cd .. && node --import tsx server/src/proofs/keygen.ts)"
          address="$(sed -n 's/^address //p' <<< "$out")"
          secret="$(sed -n 's/^secret //p' <<< "$out")"
          (umask 077 && printf '%s\n' "$secret" > secrets/notary-devnet.key)
          sudo chown 1000:1000 secrets/notary-devnet.key
          echo "SOLANA_CLUSTER=devnet" >> .env
          docker compose up -d --wait --wait-timeout 120
          # The server read it: its log names the notary's address.
          for _ in $(seq 1 20); do if docker compose logs server | grep "The notary seals every night" | grep -F "$address" > /dev/null; then break; fi; sleep 2; done
          docker compose logs server | grep "The notary seals every night" | grep -F "$address"
          # Mounted read-only, in the server's container only.
          docker inspect brinelight-server-1 --format '{{range .Mounts}}{{.Destination}} rw={{.RW}}{{println}}{{end}}' | grep -x "/run/secrets/notary-devnet.key rw=false"
          for c in brinelight-db-1 brinelight-caddy-1; do
            if docker inspect "$c" --format '{{range .Mounts}}{{.Destination}}{{println}}{{end}}' | grep /run/secrets > /dev/null; then echo "The key is mounted in $c"; exit 1; fi
          done
          # Never in what Docker shows, in the container's environment, nor in any log (grep reads everything: no -q, so
          # no broken pipe hides a match).
          leaks=0
          docker inspect brinelight-server-1 | grep -F "$secret" > /dev/null && { echo "docker inspect shows the key"; leaks=1; }
          docker compose config | grep -F "$secret" > /dev/null && { echo "docker compose config shows the key"; leaks=1; }
          docker compose exec -T server cat /proc/1/environ | tr '\0' '\n' | grep -F "$secret" > /dev/null && { echo "The key is in the server's environment"; leaks=1; }
          docker compose logs | grep -F "$secret" > /dev/null && { echo "A log shows the key"; leaks=1; }
          exit "$leaks"
      - if: failure()
        working-directory: deploy
        run: docker compose logs --tail 100
