name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    # Actions at the same moment on a real PostgreSQL: PGlite runs one transaction at a time and cannot show a locking bug.
    # And the stored cities' migration on a real PostgreSQL: a database left by the week 4 server, opened by today's.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: brinelight_test
          # A throwaway database for this job only, reachable from the runner alone: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brinelight_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One file after the other: they empty the same database, and the migration test rebuilds it as week 4 left it.
      - run: npx vitest run --no-file-parallelism server/test/concurrency.test.ts server/test/migration.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brinelight_test

  e2e:
    runs-on: ubuntu-24.04
    # Not blocking yet (week 3): it becomes required once it has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/.shots/
          if-no-files-found: ignore
          # e2e/.shots is a hidden folder: upload-artifact@v4 leaves those out unless asked.
          include-hidden-files: true

  deploy:
    # The online setup (deploy/): scripts checked, then the whole stack started as on the server, with a local certificate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      - name: Start the stack
        working-directory: deploy
        run: |
          {
            echo "API_DOMAIN=localhost"
            echo "ALLOWED_ORIGINS=https://play.example.test"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Check it
        working-directory: deploy
        run: |
          # /health's status code and answer, on one line.
          health() { code="$(curl -sSk -o "$RUNNER_TEMP/health.json" -w '%{http_code}' https://localhost/health)"; echo "$code $(cat "$RUNNER_TEMP/health.json")"; }
          expect() { out="$(health)"; echo "$out"; grep -Eq "$1" <<< "$out"; }
          # Before the first backup: the database answers, and /health says the backup is missing.
          expect '^503 .*"database":"ok".*"backup":"none"'
          # The database and the game server are never reachable from outside.
          for port in 5432 8787; do
            if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "Port $port is open, it must not be"; exit 1; fi
          done
          # The nightly backup and the weekly test restore, installed as on the server, each started once by hand.
          sudo ./install-backup.sh
          sudo systemctl start brinelight-backup.service
          expect '^200 .*"database":"ok","backup":"ok","restore":"none"'
          sudo systemctl start brinelight-restore-test.service
          expect '^200 .*"restore":"ok"'
          # The database stopped: 503, database down; started again: all well.
          docker compose stop db
          expect '^503 .*"database":"down"'
          docker compose start db
          for _ in $(seq 1 30); do if health | grep -q '^200 '; then break; fi; sleep 2; done
          expect '^200 .*"ok":true'
      - if: failure()
        working-directory: deploy
        run: docker compose logs --tail 100
